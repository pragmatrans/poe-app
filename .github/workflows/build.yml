name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest уже має Android SDK; потрібної платформи може не бути
      - name: android sdk
        run: |
          CT=$(ls -d "$ANDROID_HOME"/cmdline-tools/* 2>/dev/null | head -1)
          echo "cmdline-tools: $CT"
          yes 2>/dev/null | "$CT/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$CT/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: keystore
        env:
          KS_B64: ${{ secrets.APP_KEYSTORE_B64 }}
        run: echo "$KS_B64" | base64 -d > app/keystore.p12

      - name: assembleRelease
        env:
          KS_FILE: keystore.p12
          KS_PASS: ${{ secrets.APP_STORE_PASS }}
          KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.APP_KEY_PASS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: poe-schedule-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
