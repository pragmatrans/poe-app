plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'ua.pp.poe.schedule'
    compileSdk 34

    defaultConfig {
        applicationId "ua.pp.poe.schedule"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
