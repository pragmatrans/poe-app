plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'ua.pp.poe.schedule'
    compileSdk 34

    defaultConfig {
        applicationId "ua.pp.poe.schedule"
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KS_FILE') ?: 'keystore.p12')
            storePassword System.getenv('KS_PASS') ?: ''
            keyAlias System.getenv('KEY_ALIAS') ?: 'poe'
            keyPassword System.getenv('KEY_PASS') ?: ''
            storeType 'PKCS12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
